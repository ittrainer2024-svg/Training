            div.block1 {

            }

                background-color: aquamarine;
                 width: 300px;

                border: solid 20px #123456;

                padding: 40px 0;
            }
        </style>
    </head>
    <body>
                        <div class="block1">
                    erere</div>

            блок 2 - содержимое блока
        </div>
